version: '3.9'

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: goconnexion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - goconnexion_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goconnexion_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      # Overrides DATABASE_URL from .env.production with the internal docker host
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      NODE_ENV: production
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - goconnexion_net
    expose:
      - "3001"

  # ── Grafana (business metrics) ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: goconnexion_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Laissé sur localhost tant que le sous-domaine n'est pas branché sur nginx.
      # À passer à https://metrics.goconnexions.com une fois le DNS propagé et
      # nginx/grafana.conf.disabled activé.
      GF_SERVER_ROOT_URL: http://localhost:3000
      # SMTP pour les alertes — relais SMTP de Resend, mêmes identifiants que
      # MailService (backend/src/mail/mail.service.ts). Le nom d'utilisateur
      # "resend" est fixe (relais Resend), seule la clé API sert de mot de passe.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:465
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD: ${RESEND_API_KEY}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - goconnexion_net
    depends_on:
      postgres:
        condition: service_healthy
    # TEMPORAIRE: port exposé sur l'hôte pour tester avant que le sous-domaine
    # soit prêt. À retirer une fois nginx/grafana.conf.disabled activé, pour ne
    # plus exposer Grafana qu'à travers le reverse proxy HTTPS.
    ports:
      - "3000:3000"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: goconnexion_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - backend
    networks:
      - goconnexion_net

volumes:
  postgres_data:
  uploads:
  grafana_data:

networks:
  goconnexion_net:
    driver: bridge
